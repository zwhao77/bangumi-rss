<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>添加番剧订阅</title>
    <style>
        :root {
            --color-primary: #4a90d9;
            --color-bg: #f5f5f5;
            --color-card: #fff;
            --color-border: #e0e0e0;
            --color-text: #222;
            --color-text-light: #666;
            --radius: 6px;
            font-size: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2em auto; padding: 0 1rem; color: var(--color-text); background: #fff; }
        h2, h3 { margin: 1em 0 0.5em; }
        .card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 0.6rem; margin: 0.6rem 0; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border: 1px solid transparent; border-radius: var(--radius); font-size: 0.9rem; cursor: pointer; background: var(--color-primary); color: #fff; font-weight: 600; transition: opacity 0.2s; width: auto; }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.6; cursor: wait; }
        .btn-outline { background: none; border: 1px solid var(--color-border); color: var(--color-text-light); }
        .btn-outline:hover { background: #f0f0f0; opacity: 1; }
        .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
        .tag { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; background: #e8f0fe; color: #1a73e8; white-space: nowrap; }
        input, select, textarea { width: 100%; padding: 8px 10px; font-size: 0.9rem; border: 1px solid var(--color-border); border-radius: var(--radius); background: #fff; }
        input:focus, select:focus, textarea:focus { outline: 2px solid var(--color-primary); border-color: transparent; }
        textarea { resize: vertical; min-height: 60px; }
        .label { font-size: 0.8rem; color: var(--color-text-light); display: block; margin: 8px 0 4px; }
        .anime-card { display: flex; gap: 0.6rem; align-items: flex-start; }
        .anime-card .cover { width: 28%; max-width: 100px; flex-shrink: 0; height: 8.5rem; min-height: 5rem; overflow: hidden; border-radius: 4px; background: #f0f2f5; }
        .anime-card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .anime-card .cover:empty::after { content: '无封面'; display: flex; align-items: center; justify-content: center; height: 100%; font-size: 0.75rem; color: #999; }
        .anime-card .info { flex: 1; min-width: 0; height: 8.5rem; display: flex; flex-direction: column; overflow: hidden; }
        .anime-card .title { font-weight: 600; font-size: 0.95rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .anime-card .meta { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.25rem; font-size: 0.8rem; align-items: center; }
        .anime-card .rss-link-row { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: #888; margin-top: 0.2rem; flex-shrink: 0; }
        .rss-link-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #333; }
        .anime-card .summary { flex: 1; overflow-y: auto; font-size: 0.78rem; line-height: 1.4; color: #555; margin-top: 0.25rem; min-height: 0; padding-right: 2px; }
        .progress-bar { background: #e0e0e0; border-radius: 4px; height: 6px; margin: 4px 0; overflow: hidden; }
        .progress-fill { background: var(--color-primary); height: 100%; border-radius: 4px; transition: width 0.3s; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; border-radius: 10px; width: min(90vw,520px); max-height: 90vh; overflow-y: auto; padding: 20px 24px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
        .modal-box h3 { margin-bottom: 12px; }
        .modal-grid { display: flex; gap: 14px; margin-bottom: 14px; }
        .modal-id-area { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .id-row { display: flex; gap: 4px; }
        .id-row input { flex: 1; }
        .meta-row { font-size: .78rem; color: var(--color-text-light); }
        .modal-field { margin-bottom: 8px; }
        .modal-field label { font-size: .72rem; color: #888; display: block; margin-bottom: 2px; }
        .inline-group { display: flex; gap: 8px; align-items: center; }
        .inline-group>* { flex: 1; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
        #modalRssInfo { margin-top: 8px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-size: .78rem; color: #555; }
        @media (max-width:480px) {
            .anime-card .cover { width: 30%; max-width: 80px; height: 7.5rem; }
            .anime-card .info { height: 7.5rem; }
            .anime-card .title { font-size: .9rem; }
        }
    </style>
</head>

<body>
    <h2>添加 RSS 订阅</h2>

    <div id="step1" class="card">
        <span class="label">输入 RSS 链接</span>
        <input id="url" type="url" placeholder="https://mikanani.me/RSS/Classic/...">
        <button id="previewBtn" class="btn" onclick="previewFeed()">获取番剧信息</button>
    </div>

    <div id="result" class="card" style="display:none"></div>

    <h3 style="margin-top:1.5em">已订阅
        <button onclick="loadFeeds()" class="btn btn-sm">刷新</button>
    </h3>
    <div id="feeds"></div>

    <h3 style="margin-top:1.5em">下载进度
        <button onclick="refreshAndLoad()" class="btn btn-sm">刷新</button>
    </h3>
    <div id="downloads"></div>

    <!-- Bangumi 编辑弹窗（已优化） -->
    <div class="modal-overlay" id="bgmModal">
        <div class="modal-box">
            <h3 id="modalTitle">📝 编辑 Bangumi 信息</h3>
            <div class="modal-grid">
                <div class="modal-cover" id="modalCover"></div>
                <div class="modal-id-area">
                    <div class="id-row">
                        <input id="modalBgmId" type="number" placeholder="Bangumi ID">
                        <button id="modalIdBtn">ID 查询</button>
                        <button id="modalSearchBtn">搜索</button>
                    </div>
                    <div class="meta-row" id="modalMeta"></div>
                </div>
            </div>

            <div class="modal-field">
                <label>中文名</label>
                <input id="modalNameCn" placeholder="中文名">
            </div>
            <div class="modal-field">
                <label>原名</label>
                <input id="modalName" placeholder="原名">
            </div>

            <!-- 季数 + 集数 + 播出日期 + 周几 -->
            <div class="modal-field">
                <div class="inline-group">
                    <div style="flex:1">
                        <label>季数</label>
                        <input id="modalSeason" type="text" placeholder="例：1, 2.5, SP">
                    </div>
                    <div style="flex:1">
                        <label>集数</label>
                        <input id="modalEps" type="number" placeholder="集数">
                    </div>
                    <div style="flex:2">
                        <label>播出日期</label>
                        <input id="modalAirDate" type="text" placeholder="2024-01">
                    </div>
                    <div style="flex:1">
                        <label>周几</label>
                        <select id="modalAirWeekday">
                            <option value="">未知</option>
                            <option value="1">周一</option>
                            <option value="2">周二</option>
                            <option value="3">周三</option>
                            <option value="4">周四</option>
                            <option value="5">周五</option>
                            <option value="6">周六</option>
                            <option value="7">周日</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="modal-field">
                <label>简介</label>
                <textarea id="modalSummary" placeholder="简介"></textarea>
            </div>

            <!-- RSS 预览信息（仅新增订阅时显示） -->
            <div id="modalRssInfo">
                <div style="margin-bottom:4px"><span class="tag" id="modalRssGroup"></span> <span
                        id="modalRssLatest"></span></div>
                <div id="modalRssSamples" style="margin-top:4px"></div>
            </div>

            <div class="modal-actions">
                <button onclick="closeBangumiModal()" class="btn btn-outline">取消</button>
                <button id="modalSaveBtn" class="btn" onclick="saveBangumiModal()">✅ 保存</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 统一卡片构建函数 ============
        function buildAnimeCard(bangumiInfo, extra = {}) {
            const { season, rssUrl } = extra;
            const bgm = bangumiInfo || {};
            const weekday = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];

            const card = document.createElement('div');
            card.className = 'anime-card';

            const coverDiv = document.createElement('div');
            coverDiv.className = 'cover';
            if (bgm.image_url) {
                const img = document.createElement('img');
                img.src = bgm.image_url;
                img.alt = bgm.name_cn || bgm.name || '';
                img.onerror = () => { img.remove(); };
                coverDiv.appendChild(img);
            }
            card.appendChild(coverDiv);

            const infoDiv = document.createElement('div');
            infoDiv.className = 'info';

            const titleDiv = document.createElement('div');
            titleDiv.className = 'title';
            titleDiv.textContent = bgm.name_cn || bgm.name || '未知番剧';
            infoDiv.appendChild(titleDiv);

            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            if (bgm.rank) {
                const span = document.createElement('span');
                span.className = 'tag';
                span.textContent = `#${bgm.rank}`;
                metaDiv.appendChild(span);
            }
            if (bgm.rating) {
                const span = document.createElement('span');
                span.className = 'rating';
                span.textContent = `★ ${bgm.rating.toFixed(1)}`;
                metaDiv.appendChild(span);
            }
            if (bgm.air_date || bgm.air_weekday) {
                const span = document.createElement('span');
                span.className = 'tag';
                let text = bgm.air_date || '';
                if (bgm.air_weekday) text += (text ? ' ' : '') + weekday[bgm.air_weekday];
                span.textContent = text;
                metaDiv.appendChild(span);
            }
            if (bgm.eps_count !== undefined) {
                const span = document.createElement('span');
                span.className = 'tag tag-ongoing';
                span.textContent = bgm.eps_count ? `${bgm.eps_count} 集` : '未完结';
                metaDiv.appendChild(span);
            }
            // 季数标签：直接显示原始值
            if (season) {
                const span = document.createElement('span');
                span.className = 'tag';
                span.textContent = season;
                metaDiv.appendChild(span);
            }
            infoDiv.appendChild(metaDiv);

            if (rssUrl) {
                const row = document.createElement('div');
                row.className = 'rss-link-row';
                const textSpan = document.createElement('span');
                textSpan.className = 'rss-link-text';
                textSpan.textContent = rssUrl;
                textSpan.title = rssUrl;
                row.appendChild(textSpan);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn btn-sm btn-outline';
                copyBtn.textContent = '复制';
                copyBtn.onclick = (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(rssUrl).then(() => {
                        copyBtn.textContent = '✓ 已复制';
                        setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
                    }).catch(() => {
                        const tmp = document.createElement('textarea');
                        tmp.value = rssUrl;
                        document.body.appendChild(tmp);
                        tmp.select();
                        document.execCommand('copy');
                        document.body.removeChild(tmp);
                        copyBtn.textContent = '✓ 已复制';
                        setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
                    });
                };
                row.appendChild(copyBtn);
                infoDiv.appendChild(row);
            }

            if (bgm.summary) {
                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'summary';
                summaryDiv.textContent = bgm.summary;
                infoDiv.appendChild(summaryDiv);
            } else if (Object.keys(bgm).length > 0) {
                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'summary';
                summaryDiv.textContent = '暂无简介';
                summaryDiv.style.color = '#ccc';
                infoDiv.appendChild(summaryDiv);
            }

            card.appendChild(infoDiv);
            return card;
        }

        let pendingUrl = '';

        async function previewFeed() {
            const url = document.getElementById('url').value.trim();
            if (!url) return;
            pendingUrl = url;
            const btn = document.getElementById('previewBtn');
            btn.disabled = true;
            btn.textContent = '加载中…';
            document.getElementById('result').style.display = 'none';
            try {
                const resp = await fetch('/api/feeds/preview', { method: 'POST', body: url });
                const data = await resp.json();
                window._bangumiInfo = data.bangumi_info || null;
                window._rssPreview = { group: data.group, latest_episode: data.latest_episode, sample_titles: data.sample_titles, suggested_season: data.suggested_season };
                openBangumiModal({
                    title: '📝 确认订阅',
                    info: window._bangumiInfo || {},
                    rss: window._rssPreview,
                    onSave: async (editedInfo) => {
                        const name = editedInfo.name_cn || data.suggested_name || '';
                        const season = document.getElementById('modalSeason').value.trim() || undefined;
                        const body = JSON.stringify({ url: pendingUrl, name, season, bangumi_info: editedInfo });
                        const resp = await fetch('/api/feeds', { method: 'POST', body });
                        const result = await resp.json();
                        document.getElementById('result').style.display = 'block';
                        document.getElementById('result').innerHTML = result.success
                            ? `<p style="color:green">✅ 订阅成功</p><p class="label">Feed ID: ${result.message}</p>`
                            : `<p style="color:red">❌ 订阅失败: ${result.message}</p>`;
                        loadFeeds();
                        loadDownloads();
                    }
                });
            } catch (e) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerHTML = `<p style="color:red">❌ 请求失败: ${e.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '获取番剧信息';
            }
        }

        async function loadFeeds() {
            try {
                const resp = await fetch('/api/feeds');
                const feeds = await resp.json();
                const container = document.getElementById('feeds');
                container.innerHTML = '';
                feeds.forEach(f => {
                    const bgm = f.bangumi_info || {};
                    const card = buildAnimeCard(bgm, { season: f.season, rssUrl: f.url });
                    if (!bgm.name_cn && !bgm.name && f.name) {
                        card.querySelector('.title').textContent = f.name;
                    }
                    container.appendChild(card);

                    if (!f.bangumi_info && f.name) {
                        const infoRow = document.createElement('div');
                        infoRow.style.cssText = 'margin-top:4px;display:flex;flex-direction:column;gap:4px';
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-sm btn-outline';
                        btn.textContent = '🔍 获取信息';
                        btn.onclick = async (e) => {
                            e.stopPropagation();
                            btn.disabled = true;
                            btn.textContent = '搜索中…';
                            try {
                                const sr = await fetch('/api/bangumi/search?name=' + encodeURIComponent(f.name));
                                const sd = await sr.json();
                                if (sd.success && sd.bangumi_info) {
                                    openBangumiModal({
                                        title: '📝 补全 Bangumi 信息',
                                        info: sd.bangumi_info,
                                        onSave: async (editedInfo) => {
                                            const body = JSON.stringify({ name: f.name, season: f.season, bangumi_info: editedInfo });
                                            await fetch('/api/feeds/' + f.id, { method: 'PUT', body });
                                            loadFeeds();
                                        }
                                    });
                                } else {
                                    btn.textContent = '❌ 未找到';
                                    setTimeout(() => { btn.textContent = '🔍 获取信息'; btn.disabled = false; }, 2000);
                                }
                            } catch (e) {
                                btn.textContent = '❌ 失败';
                                setTimeout(() => { btn.textContent = '🔍 获取信息'; btn.disabled = false; }, 2000);
                            }
                        };
                        infoRow.appendChild(btn);
                        card.appendChild(infoRow);
                    } else if (f.bangumi_info) {
                        const infoRow = document.createElement('div');
                        infoRow.style.cssText = 'margin-top:4px';
                        const editBtn = document.createElement('button');
                        editBtn.className = 'btn btn-sm btn-outline';
                        editBtn.textContent = '✏️ 编辑信息';
                        editBtn.onclick = (e) => {
                            e.stopPropagation();
                            openBangumiModal({
                                title: '📝 编辑 Bangumi 信息',
                                info: f.bangumi_info,
                                onSave: async (editedInfo) => {
                                    const body = JSON.stringify({ name: f.name, season: f.season, bangumi_info: editedInfo });
                                    await fetch('/api/feeds/' + f.id, { method: 'PUT', body });
                                    loadFeeds();
                                }
                            });
                        };
                        infoRow.appendChild(editBtn);
                        card.appendChild(infoRow);
                    }
                });
            } catch (e) { }
        }

        async function refreshAndLoad() {
            try {
                await fetch('/api/downloads/refresh', { method: 'POST' });
                loadDownloads();
            } catch (e) { }
        }

        async function loadDownloads() {
            try {
                const resp = await fetch('/api/downloads');
                const data = await resp.json();
                const el = document.getElementById('downloads');
                if (!data.length) {
                    el.innerHTML = '<p class="label">暂无下载任务</p>';
                    return;
                }
                el.innerHTML = data.map(d => {
                    const pct = (d.progress * 100).toFixed(1);
                    const speed = d.speed > 0 ? (d.speed / 1048576).toFixed(1) + ' MB/s' : '—';
                    const size = (d.size / 1073741824).toFixed(1) + ' GB';
                    const seasonTag = d.season ? `<span class="tag">${d.season}</span>` : '';
                    return `<div>
            <strong>${d.feed_name || d.name}</strong>
            <span class="tag">${d.state}</span>
            ${seasonTag}
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <span class="label">${pct}% · ${speed} · ${size}</span>
          </div>`;
                }).join('');
            } catch (e) { }
        }

        // ============ 弹窗逻辑 ============
        let _modalOnSave = null;

        function openBangumiModal(options) {
            const info = options.info || {};
            _modalOnSave = options.onSave || null;

            document.getElementById('modalTitle').textContent = options.title || '📝 编辑 Bangumi 信息';
            const cover = document.getElementById('modalCover');
            cover.innerHTML = '';
            if (info.image_url) {
                const img = document.createElement('img');
                img.src = info.image_url;
                img.alt = info.name_cn || '';
                img.onerror = () => { img.remove(); };
                cover.appendChild(img);
            }

            document.getElementById('modalBgmId').value = info.bangumi_id || '';
            document.getElementById('modalNameCn').value = info.name_cn || '';
            document.getElementById('modalName').value = info.name || '';
            document.getElementById('modalSummary').value = info.summary || '';
            document.getElementById('modalEps').value = info.eps_count ?? '';
            document.getElementById('modalAirDate').value = info.air_date || '';
            document.getElementById('modalAirWeekday').value = info.air_weekday ?? '';

            // 季数（字符串处理）
            const seasonInput = document.getElementById('modalSeason');
            seasonInput.value = info.season || (options.rss && options.rss.suggested_season) || '';

            // meta 概览
            const meta = document.getElementById('modalMeta');
            const parts = [];
            if (info.rating) { parts.push(`★ ${info.rating.toFixed(1)}`); meta.dataset.rating = info.rating; }
            if (info.rank) { parts.push(`#${info.rank}`); meta.dataset.rank = info.rank; }
            if (info.air_date) parts.push(info.air_date);
            if (info.eps_count) parts.push(`${info.eps_count} 集`);
            if (info.score_count) meta.dataset.scoreCount = info.score_count;
            meta.textContent = parts.join(' · ') || '';

            // RSS 信息
            const rssDiv = document.getElementById('modalRssInfo');
            const rss = options.rss;
            if (rss) {
                rssDiv.style.display = 'block';
                document.getElementById('modalRssGroup').textContent = rss.group || '-';
                document.getElementById('modalRssLatest').textContent = rss.latest_episode ? `最新集: 第 ${rss.latest_episode} 集` : '';
                const samples = document.getElementById('modalRssSamples');
                samples.innerHTML = '';
                if (rss.sample_titles && rss.sample_titles.length) {
                    const label = document.createElement('div');
                    label.style.cssText = 'margin:4px 0 2px;font-size:.72rem;color:#888';
                    label.textContent = '样本标题:';
                    samples.appendChild(label);
                    rss.sample_titles.forEach(t => {
                        const el = document.createElement('div');
                        el.style.cssText = 'font-size:.72rem;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
                        el.textContent = t;
                        samples.appendChild(el);
                    });
                }
            } else {
                rssDiv.style.display = 'none';
            }

            // 按钮重置
            document.getElementById('modalIdBtn').onclick = async () => {
                const id = document.getElementById('modalBgmId').value.trim();
                if (!id) return;
                const btn = document.getElementById('modalIdBtn');
                btn.disabled = true; btn.textContent = '查询中…';
                try {
                    const resp = await fetch('/api/bangumi/subjects/' + id);
                    const data = await resp.json();
                    if (data.success && data.bangumi_info) {
                        openBangumiModal({ ...options, info: data.bangumi_info });
                    } else {
                        btn.textContent = '❌ 未找到';
                        setTimeout(() => { btn.textContent = 'ID 查询'; btn.disabled = false; }, 1500);
                    }
                } catch (e) {
                    btn.textContent = '❌ 失败';
                    setTimeout(() => { btn.textContent = 'ID 查询'; btn.disabled = false; }, 1500);
                }
            };
            document.getElementById('modalIdBtn').textContent = 'ID 查询';

            document.getElementById('modalSearchBtn').onclick = async () => {
                const name = document.getElementById('modalNameCn').value.trim() || document.getElementById('modalName').value.trim();
                if (!name) return;
                const btn = document.getElementById('modalSearchBtn');
                btn.disabled = true; btn.textContent = '搜索…';
                try {
                    const resp = await fetch('/api/bangumi/search?name=' + encodeURIComponent(name));
                    const data = await resp.json();
                    if (data.success && data.bangumi_info) {
                        openBangumiModal({ ...options, info: data.bangumi_info });
                    } else {
                        btn.textContent = '❌ 未找到';
                        setTimeout(() => { btn.textContent = '搜索'; btn.disabled = false; }, 1500);
                    }
                } catch (e) {
                    btn.textContent = '❌ 失败';
                    setTimeout(() => { btn.textContent = '搜索'; btn.disabled = false; }, 1500);
                }
            };
            document.getElementById('modalSearchBtn').textContent = '搜索';

            document.getElementById('modalSaveBtn').disabled = false;
            document.getElementById('modalSaveBtn').textContent = '✅ 保存';
            document.getElementById('bgmModal').classList.add('active');
        }

        function closeBangumiModal() {
            document.getElementById('bgmModal').classList.remove('active');
            _modalOnSave = null;
        }

        function saveBangumiModal() {
            if (!_modalOnSave) { closeBangumiModal(); return; }
            const info = {
                bangumi_id: parseInt(document.getElementById('modalBgmId').value) || 0,
                name_cn: document.getElementById('modalNameCn').value,
                name: document.getElementById('modalName').value,
                summary: document.getElementById('modalSummary').value,
                season: document.getElementById('modalSeason').value.trim() || undefined,
                eps_count: parseInt(document.getElementById('modalEps').value) || undefined,
                air_date: document.getElementById('modalAirDate').value,
                air_weekday: parseInt(document.getElementById('modalAirWeekday').value) || undefined,
            };
            const coverImg = document.querySelector('#modalCover img');
            info.image_url = coverImg ? coverImg.src : '';
            const metaEl = document.getElementById('modalMeta');
            if (metaEl.dataset.rating) info.rating = parseFloat(metaEl.dataset.rating);
            if (metaEl.dataset.rank) info.rank = parseInt(metaEl.dataset.rank);
            if (metaEl.dataset.scoreCount) info.score_count = parseInt(metaEl.dataset.scoreCount);

            const saveBtn = document.getElementById('modalSaveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中…';
            _modalOnSave(info).then(() => {
                closeBangumiModal();
            }).catch((e) => {
                saveBtn.disabled = false;
                saveBtn.textContent = '✅ 保存';
                const result = document.getElementById('result');
                if (result) {
                    result.style.display = 'block';
                    result.innerHTML = `<p style="color:red">❌ 请求失败: ${e?.message || '未知错误'}</p>`;
                }
            });
        }

        // 初始化
        loadFeeds();
        loadDownloads();
    </script>
</body>

</html>
