<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>添加番剧订阅</title>
    <style>
        :root {
            --card-img-height: 8.5rem;
            /* 约136px，基于16px根字体 */
            --card-gap: 0.6rem;
            font-size: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 520px;
            margin: 2em auto;
            padding: 0 1rem;
            color: #222;
        }

        h2 {
            margin-bottom: .5em;
        }

        .step {
            margin: 1em 0;
            padding: 1em;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .step.hidden {
            display: none;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        input:focus {
            outline: 2px solid #4a90d9;
            border-color: transparent;
        }

        button {
            background: #4a90d9;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #357abd;
        }

        button:disabled {
            background: #a0c4e8;
            cursor: wait;
        }

        /* 统一卡片样式 */
        .anime-card {
            display: flex;
            gap: var(--card-gap);
            align-items: flex-start;
            padding: 0.6rem;
            margin: 0.6rem 0;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            transition: box-shadow 0.2s;
        }

        .anime-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* 封面区域：宽度用百分比，最大宽度限制，高度固定 */
        .anime-card .cover {
            width: 28%;
            max-width: 100px;
            flex-shrink: 0;
            height: var(--card-img-height);
            min-height: 5rem;
            overflow: hidden;
            border-radius: 4px;
            background: #f0f2f5
        }

        .anime-card .cover:empty::after {
            content: '无封面';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: .75rem;
            color: #999;
        }

        .anime-card .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 信息区域：flex列布局，高度与封面一致，作为滚动边界 */
        .anime-card .info {
            flex: 1;
            min-width: 0;
            height: var(--card-img-height);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 配合内部滚动 */
        }

        /* 标题：可换行，限制最大行数（可选） */
        .anime-card .title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        /* 元数据标签行：自动换行 */
        .anime-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.25rem;
            font-size: 0.8rem;
            align-items: center;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background: #e8f0fe;
            color: #1a73e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .tag-ongoing {
            background: #fff3e0;
            color: #e65100;
        }

        .rating {
            color: #f5a623;
            font-weight: 600;
            white-space: nowrap;
        }

        /* RSS链接行：截断链接 + 复制按钮 */
        .anime-card .rss-link-row {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.2rem;
            flex-shrink: 0;
        }

        .anime-card .rss-link-text {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
        }

        .anime-card .copy-btn {
            flex-shrink: 0;
            width: auto;
            background: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            color: #666;
            line-height: 1.2;
            transition: background 0.2s;
        }

        .anime-card .copy-btn:hover {
            background: #f0f0f0;
        }

        /* ══════ Bangumi 编辑弹窗 ══════ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #fff;
            border-radius: 10px;
            width: min(90vw, 520px);
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,.2);
        }
        .modal-box h3 { margin: 0 0 12px 0; font-size: 1rem; }

        .modal-grid {
            display: flex;
            gap: 14px;
            margin-bottom: 14px;
        }
        .modal-cover {
            width: 100px;
            min-height: 140px;
            border-radius: 4px;
            background: #f0f2f5;
            flex-shrink: 0;
            overflow: hidden;
        }
        .modal-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .modal-cover:empty::after {
            content: '无封面';
            display: flex; align-items: center; justify-content: center;
            height: 100%; font-size: .7rem; color: #999;
        }
        .modal-id-area {
            flex: 1;
            display: flex; flex-direction: column; gap: 6px;
        }
        .modal-id-area .id-row {
            display: flex; gap: 4px;
        }
        .modal-id-area .id-row input { flex: 1; }
        .modal-id-area .id-row button { width: auto; padding: 6px 10px; font-size: .75rem; white-space: nowrap; }
        .modal-id-area .meta-row {
            font-size: .78rem; color: #666;
        }

        .modal-field { margin-bottom: 8px; }
        .modal-field label { display: block; font-size: .72rem; color: #888; margin-bottom: 2px; }
        .modal-field input, .modal-field textarea, .modal-field select {
            width: 100%; padding: 6px 8px; font-size: .82rem;
            border: 1px solid #ddd; border-radius: 4px;
        }
        .modal-field textarea { resize: vertical; min-height: 60px; }
        .modal-field .inline-group {
            display: flex; gap: 8px; align-items: center;
        }
        .modal-field .inline-group input { flex: 1; }

        .modal-actions {
            display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;
        }
        .modal-actions button { width: auto; padding: 6px 18px; font-size: .82rem; }

        /* 简介区域：剩余空间，可滚动 */
        .anime-card .summary {
            flex: 1;
            overflow-y: auto;
            font-size: 0.78rem;
            line-height: 1.4;
            color: #555;
            margin-top: 0.25rem;
            min-height: 0;
            /* flex限制必须 */
            padding-right: 2px;
            /* 留出滚动条空间 */
        }

        /* 移动端微调 */
        @media (max-width: 480px) {
            :root {
                --card-img-height: 7.5rem;
                /* 稍矮，适应小屏 */
            }

            .anime-card .cover {
                width: 30%;
                max-width: 90px;
            }

            .anime-card .title {
                font-size: 0.9rem;
            }

            .anime-card .meta {
                font-size: 0.75rem;
            }

            .anime-card .summary {
                font-size: 0.75rem;
            }
        }

        /* 原 form-card 保留 */
        .form-card {
            padding: 10px;
            margin: 10px 0;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
        }

        .label {
            font-size: .85em;
            color: #666;
            margin-top: 8px;
            display: block;
        }

        .samples {
            font-size: .8em;
            color: #888;
            max-height: 100px;
            overflow-y: auto;
            margin-top: 4px;
        }

        .hint {
            font-size: .8em;
            color: #aaa;
            margin-top: 4px;
            animation: fadeOut 3s ease-out 3s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }

        .samples li {
            list-style: none;
            padding: 2px 0;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-box {
            text-align: center;
            padding: 24px;
            color: #888;
            font-size: .9em;
        }

        /* 下载进度卡片 */
        #downloads>div {
            margin: 8px 0;
            padding: 8px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 6px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 4px;
            height: 8px;
            margin: 4px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: #4a90d9;
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
    </style>
</head>

<body>
    <h2>添加 RSS 订阅</h2>

    <div id="step1" class="step">
        <span class="label">输入 RSS 链接</span>
        <input id="url" type="url" placeholder="https://mikanani.me/RSS/Classic/...">
        <button id="previewBtn" onclick="previewFeed()">获取番剧信息</button>
    </div>

    <div id="result" class="step hidden"></div>

    <h3 style="margin-top:1.5em">已订阅 <button onclick="loadFeeds()"
            style="width:auto;padding:4px 12px;font-size:13px">刷新</button></h3>
    <div id="feeds"></div>

    <h3 style="margin-top:1.5em">下载进度 <button onclick="refreshAndLoad()"
            style="width:auto;padding:4px 12px;font-size:13px">刷新</button></h3>
    <div id="downloads"></div>

    <script>
        // ============ 工具函数：中间省略 ============
        function truncateMiddle(url, maxLen = 55) {
            if (url.length <= maxLen) return url;
            const half = Math.floor(maxLen / 2) - 1; // 前后各保留约一半，减1留给省略号
            const start = url.slice(0, half);
            const end = url.slice(-half);
            return `${start}...${end}`;
        }

        // ============ 统一卡片构建函数 ============
        function buildAnimeCard(bangumiInfo, extra = {}) {
            const { season, rssUrl } = extra;
            const bgm = bangumiInfo || {};
            const weekday = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];

            const card = document.createElement('div');
            card.className = 'anime-card';

            // 左侧封面
            const coverDiv = document.createElement('div');
            coverDiv.className = 'cover';
            if (bgm.image_url) {
                const img = document.createElement('img');
                img.src = bgm.image_url;
                img.alt = bgm.name_cn || bgm.name || '';
                img.onerror = () => { img.remove(); };
                coverDiv.appendChild(img);
            }
            card.appendChild(coverDiv);

            // 右侧信息
            const infoDiv = document.createElement('div');
            infoDiv.className = 'info';

            // 标题
            const titleDiv = document.createElement('div');
            titleDiv.className = 'title';
            titleDiv.textContent = bgm.name_cn || bgm.name || '未知番剧';
            infoDiv.appendChild(titleDiv);

            // 元数据标签
            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            // 排名
            if (bgm.rank) {
                const rankSpan = document.createElement('span');
                rankSpan.className = 'tag';
                rankSpan.textContent = `#${bgm.rank}`;
                metaDiv.appendChild(rankSpan);
            }
            // 评分
            if (bgm.rating) {
                const ratingSpan = document.createElement('span');
                ratingSpan.className = 'rating';
                ratingSpan.textContent = `★ ${bgm.rating.toFixed(1)}`;
                metaDiv.appendChild(ratingSpan);
            }
            // 播出日期 + 周几
            if (bgm.air_date || bgm.air_weekday) {
                const airSpan = document.createElement('span');
                airSpan.className = 'tag';
                let airText = bgm.air_date || '';
                if (bgm.air_weekday) {
                    airText += (airText ? ' ' : '') + weekday[bgm.air_weekday];
                }
                airSpan.textContent = airText;
                metaDiv.appendChild(airSpan);
            }
            // 集数状态
            if (bgm.eps_count !== undefined) {
                const epsSpan = document.createElement('span');
                epsSpan.className = 'tag tag-ongoing';
                epsSpan.textContent = bgm.eps_count ? `${bgm.eps_count} 集` : '未完结';
                metaDiv.appendChild(epsSpan);
            }
            // 季数（仅订阅卡片显示）
            if (season !== undefined) {
                const seasonSpan = document.createElement('span');
                seasonSpan.className = 'tag';
                seasonSpan.textContent = `S${season}`;
                metaDiv.appendChild(seasonSpan);
            }
            infoDiv.appendChild(metaDiv);

            // RSS链接行（中间省略 + 复制按钮）
            if (rssUrl) {
                const row = document.createElement('div');
                row.className = 'rss-link-row';

                const textSpan = document.createElement('span');
                textSpan.className = 'rss-link-text';
                textSpan.textContent = rssUrl;
                textSpan.title = rssUrl;
                row.appendChild(textSpan);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '复制';
                copyBtn.onclick = (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(rssUrl).then(() => {
                        copyBtn.textContent = '✓ 已复制';
                        setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
                    }).catch(() => {
                        const tmp = document.createElement('textarea');
                        tmp.value = rssUrl;
                        document.body.appendChild(tmp);
                        tmp.select();
                        document.execCommand('copy');
                        document.body.removeChild(tmp);
                        copyBtn.textContent = '✓ 已复制';
                        setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
                    });
                };
                row.appendChild(copyBtn);
                infoDiv.appendChild(row);
            }

            // 简介（如果存在）
            if (bgm.summary) {
                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'summary';
                summaryDiv.textContent = bgm.summary;
                infoDiv.appendChild(summaryDiv);
            } else if (Object.keys(bgm).length > 0) {
                // 有 bangumi_info 但无简介时给淡提示，保持版面一致
                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'summary';
                summaryDiv.textContent = '暂无简介';
                summaryDiv.style.color = '#ccc';
                infoDiv.appendChild(summaryDiv);
            }

            card.appendChild(infoDiv);
            return card;
        }

        // ============ 原功能逻辑（已适配统一卡片） ============
        let pendingUrl = '';

        async function previewFeed() {
            const url = document.getElementById('url').value.trim();
            if (!url) return;
            pendingUrl = url;
            const btn = document.getElementById('previewBtn');
            btn.disabled = true;
            btn.textContent = '加载中…';
            document.getElementById('result').classList.add('hidden');
            try {
                const resp = await fetch('/api/feeds/preview', { method: 'POST', body: url });
                const data = await resp.json();
                window._bangumiInfo = data.bangumi_info || null;
                window._rssPreview = { group: data.group, latest_episode: data.latest_episode, sample_titles: data.sample_titles, suggested_season: data.suggested_season };
                // 直接打开弹窗
                openBangumiModal({
                    title: '📝 确认订阅',
                    info: window._bangumiInfo || {},
                    rss: window._rssPreview,
                    onSave: async (editedInfo) => {
                        const name = editedInfo.name_cn || data.suggested_name || '';
                        const season = parseInt(document.getElementById('modalSeason').value);
                        const body = JSON.stringify({ url: pendingUrl, name, season, bangumi_info: editedInfo });
                        const resp = await fetch('/api/feeds', { method: 'POST', body });
                        const result = await resp.json();
                        document.getElementById('result').classList.remove('hidden');
                        document.getElementById('result').innerHTML = result.success
                            ? `<p style="color:green">✅ 订阅成功</p><p class="label">Feed ID: ${result.message}</p>`
                            : `<p style="color:red">❌ 订阅失败: ${result.message}</p>`;
                        loadFeeds();
                        loadDownloads();
                    }
                });
            } catch (e) {
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('result').innerHTML =
                    `<p style="color:red">❌ 请求失败: ${e.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '获取番剧信息';
            }
        }

        // 加载已订阅列表
        async function loadFeeds() {
            try {
                const resp = await fetch('/api/feeds');
                const feeds = await resp.json();
                const container = document.getElementById('feeds');
                container.innerHTML = '';
                feeds.forEach(f => {
                    const bgm = f.bangumi_info || {};
                    const card = buildAnimeCard(bgm, {
                        season: f.season,
                        rssUrl: f.url
                    });
                    // 如果没有bangumi信息，但至少有名称，可调整标题
                    if (!bgm.name_cn && !bgm.name && f.name) {
                        card.querySelector('.title').textContent = f.name;
                    }
                    container.appendChild(card);

                    // 对无 bangumi_info 的订阅，附加"获取番剧信息"按钮
                    if (!f.bangumi_info && f.name) {
                        const infoRow = document.createElement('div');
                        infoRow.style.cssText = 'margin-top:4px;display:flex;flex-direction:column;gap:4px';

                        const btn = document.createElement('button');
                        btn.className = 'copy-btn';
                        btn.textContent = '🔍 获取信息';
                        btn.onclick = async (e) => {
                            e.stopPropagation();
                            btn.disabled = true;
                            btn.textContent = '搜索中…';
                            try {
                                const sr = await fetch('/api/bangumi/search?name=' + encodeURIComponent(f.name));
                                const sd = await sr.json();
                                if (sd.success && sd.bangumi_info) {
                                    openBangumiModal({
                                        title: '📝 补全 Bangumi 信息',
                                        info: sd.bangumi_info,
                                        onSave: async (editedInfo) => {
                                            const body = JSON.stringify({ name: f.name, season: f.season, bangumi_info: editedInfo });
                                            await fetch('/api/feeds/' + f.id, { method: 'PUT', body });
                                            loadFeeds();
                                        }
                                    });
                                } else {
                                    btn.textContent = '❌ 未找到';
                                    setTimeout(() => { btn.textContent = '🔍 获取信息'; btn.disabled = false; }, 2000);
                                }
                            } catch (e) {
                                btn.textContent = '❌ 失败';
                                setTimeout(() => { btn.textContent = '🔍 获取信息'; btn.disabled = false; }, 2000);
                            }
                        };
                        infoRow.appendChild(btn);
                        card.appendChild(infoRow);
                    } else if (f.bangumi_info) {
                        // 已有信息，加编辑按钮
                        const infoRow = document.createElement('div');
                        infoRow.style.cssText = 'margin-top:4px';
                        const editBtn = document.createElement('button');
                        editBtn.className = 'copy-btn';
                        editBtn.textContent = '✏️ 编辑信息';
                        editBtn.onclick = (e) => {
                            e.stopPropagation();
                            openBangumiModal({
                                title: '📝 编辑 Bangumi 信息',
                                info: f.bangumi_info,
                                onSave: async (editedInfo) => {
                                    const body = JSON.stringify({ name: f.name, season: f.season, bangumi_info: editedInfo });
                                    await fetch('/api/feeds/' + f.id, { method: 'PUT', body });
                                    loadFeeds();
                                }
                            });
                        };
                        infoRow.appendChild(editBtn);
                        card.appendChild(infoRow);
                    }
                });
            } catch (e) {
                // 忽略，保持空列表
            }
        }

        // 下载进度相关
        async function refreshAndLoad() {
            try {
                await fetch('/api/downloads/refresh', { method: 'POST' });
                loadDownloads();
            } catch (e) {
                // 忽略，保持当前状态
            }
        }

        async function loadDownloads() {
            try {
                const resp = await fetch('/api/downloads');
                const data = await resp.json();
                const el = document.getElementById('downloads');
                if (!data.length) {
                    el.innerHTML = '<p class="label">暂无下载任务</p>';
                    return;
                }
                el.innerHTML = data.map(d => {
                    const pct = (d.progress * 100).toFixed(1);
                    const speed = d.speed > 0 ? (d.speed / 1048576).toFixed(1) + ' MB/s' : '—';
                    const size = (d.size / 1073741824).toFixed(1) + ' GB';
                    return `<div>
                        <strong>${d.feed_name || d.name}</strong>
                        <span class="tag">${d.state}</span>
                        <span class="tag">S${d.season}</span>
                        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                        <span class="label">${pct}% · ${speed} · ${size}</span>
                    </div>`;
                }).join('');
            } catch (e) {
                // 忽略，保持当前状态
            }
        }

        // ══════ Bangumi 编辑弹窗 ══════
        let _modalOnSave = null; // 保存回调

        function openBangumiModal(options) {
            // options = { info, onSave, rss?, season? }
            // info: { bangumi_id, name_cn, name, summary, eps_count, rating, rank, air_date, air_weekday, image_url }
            const info = options.info || {};
            _modalOnSave = options.onSave || null;

            document.getElementById('modalTitle').textContent = options.title || '📝 编辑 Bangumi 信息';

            // 封面
            const cover = document.getElementById('modalCover');
            cover.innerHTML = '';
            if (info.image_url) {
                const img = document.createElement('img');
                img.src = info.image_url;
                img.alt = info.name_cn || '';
                img.onerror = () => { img.remove(); };
                cover.appendChild(img);
            }

            // 字段
            document.getElementById('modalBgmId').value = info.bangumi_id || '';
            document.getElementById('modalNameCn').value = info.name_cn || '';
            document.getElementById('modalName').value = info.name || '';
            document.getElementById('modalSummary').value = info.summary || '';
            document.getElementById('modalEps').value = info.eps_count ?? '';
            document.getElementById('modalRating').value = info.rating ? `★ ${info.rating.toFixed(1)}` : '';
            document.getElementById('modalRank').value = info.rank ? `#${info.rank}` : '';
            document.getElementById('modalAirDate').value = info.air_date || '';
            document.getElementById('modalAirWeekday').value = info.air_weekday ?? '';

            // meta 标签：评分概览 + 存储只读字段
            const meta = document.getElementById('modalMeta');
            const parts = [];
            if (info.rating) { parts.push(`★ ${info.rating.toFixed(1)}`); meta.dataset.rating = info.rating; }
            if (info.rank) { parts.push(`#${info.rank}`); meta.dataset.rank = info.rank; }
            if (info.air_date) parts.push(info.air_date);
            if (info.eps_count) parts.push(`${info.eps_count} 集`);
            if (info.score_count) meta.dataset.scoreCount = info.score_count;
            meta.textContent = parts.join(' · ') || '';

            // RSS 元数据（仅新订阅预览时显示）
            const rssDiv = document.getElementById('modalRssInfo');
            const rss = options.rss;
            if (rss) {
                rssDiv.style.display = 'block';
                document.getElementById('modalRssGroup').textContent = rss.group || '-';
                document.getElementById('modalRssLatest').textContent = rss.latest_episode ? `最新集: 第 ${rss.latest_episode} 集` : '';
                const samples = document.getElementById('modalRssSamples');
                samples.innerHTML = '';
                if (rss.sample_titles && rss.sample_titles.length) {
                    const label = document.createElement('div');
                    label.style.cssText = 'margin:4px 0 2px;font-size:.72rem;color:#888';
                    label.textContent = '样本标题:';
                    samples.appendChild(label);
                    rss.sample_titles.forEach(t => {
                        const el = document.createElement('div');
                        el.style.cssText = 'font-size:.72rem;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
                        el.textContent = t;
                        samples.appendChild(el);
                    });
                }
                // 季数
                const seasonSel = document.getElementById('modalSeason');
                if (rss.suggested_season) seasonSel.value = rss.suggested_season;
            } else {
                rssDiv.style.display = 'none';
            }

            // ID 查询按钮
            document.getElementById('modalIdBtn').onclick = async () => {
                const id = document.getElementById('modalBgmId').value.trim();
                if (!id) return;
                const btn = document.getElementById('modalIdBtn');
                btn.disabled = true; btn.textContent = '查询中…';
                try {
                    const resp = await fetch('/api/bangumi/subjects/' + id);
                    const data = await resp.json();
                    if (data.success && data.bangumi_info) {
                        openBangumiModal({ ...options, info: data.bangumi_info });
                    } else {
                        btn.textContent = '❌ 未找到';
                        setTimeout(() => { btn.textContent = 'ID 查询'; btn.disabled = false; }, 1500);
                    }
                } catch (e) {
                    btn.textContent = '❌ 失败';
                    setTimeout(() => { btn.textContent = 'ID 查询'; btn.disabled = false; }, 1500);
                } finally {
                    btn.disabled = false;
                }
            };
            document.getElementById('modalIdBtn').textContent = 'ID 查询';

            // 搜索按钮
            document.getElementById('modalSearchBtn').onclick = async () => {
                const name = document.getElementById('modalNameCn').value.trim() || document.getElementById('modalName').value.trim();
                if (!name) return;
                const btn = document.getElementById('modalSearchBtn');
                btn.disabled = true; btn.textContent = '搜索…';
                try {
                    const resp = await fetch('/api/bangumi/search?name=' + encodeURIComponent(name));
                    const data = await resp.json();
                    if (data.success && data.bangumi_info) {
                        openBangumiModal({ ...options, info: data.bangumi_info });
                    } else {
                        btn.textContent = '❌ 未找到';
                        setTimeout(() => { btn.textContent = '搜索'; btn.disabled = false; }, 1500);
                    }
                } catch (e) {
                    btn.textContent = '❌ 失败';
                    setTimeout(() => { btn.textContent = '搜索'; btn.disabled = false; }, 1500);
                } finally {
                    btn.disabled = false;
                }
            };
            document.getElementById('modalSearchBtn').textContent = '搜索';

            // 重置保存按钮状态
            const saveBtn = document.getElementById('modalSaveBtn');
            saveBtn.disabled = false;
            saveBtn.textContent = '✅ 保存';

            document.getElementById('bgmModal').classList.add('active');
        }

        function closeBangumiModal() {
            document.getElementById('bgmModal').classList.remove('active');
            _modalOnSave = null;
        }

        function saveBangumiModal() {
            if (!_modalOnSave) { closeBangumiModal(); return; }
            // 从页面字段收集可编辑值
            const info = {
                bangumi_id: parseInt(document.getElementById('modalBgmId').value) || 0,
                name_cn: document.getElementById('modalNameCn').value,
                name: document.getElementById('modalName').value,
                summary: document.getElementById('modalSummary').value,
                eps_count: parseInt(document.getElementById('modalEps').value) || undefined,
                air_date: document.getElementById('modalAirDate').value,
                air_weekday: parseInt(document.getElementById('modalAirWeekday').value) || undefined,
            };
            // 保留只读字段（从上次载入的数据中取，避免丢失）
            const cover = document.getElementById('modalCover');
            const img = cover.querySelector('img');
            info.image_url = img ? img.src : '';
            // 从 meta 区域隐藏字段取值
            const metaEl = document.getElementById('modalMeta');
            if (metaEl.dataset.rating) info.rating = parseFloat(metaEl.dataset.rating);
            if (metaEl.dataset.rank) info.rank = parseInt(metaEl.dataset.rank);
            if (metaEl.dataset.scoreCount) info.score_count = parseInt(metaEl.dataset.scoreCount);

            const saveBtn = document.getElementById('modalSaveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中…';
            _modalOnSave(info).then(() => {
                closeBangumiModal();
            }).catch((e) => {
                saveBtn.disabled = false;
                saveBtn.textContent = '✅ 保存';
                // 如果是订阅流程，显示错误
                const result = document.getElementById('result');
                if (result) {
                    result.classList.remove('hidden');
                    result.innerHTML = `<p style="color:red">❌ 请求失败: ${e?.message || '未知错误'}</p>`;
                }
            });
        }

        // 初始加载
        loadFeeds();
        loadDownloads();
    </script>

    <!-- ══════ Bangumi 编辑弹窗 ══════ -->
    <div class="modal-overlay" id="bgmModal">
        <div class="modal-box">
            <h3 id="modalTitle">📝 编辑 Bangumi 信息</h3>
            <div class="modal-grid">
                <div class="modal-cover" id="modalCover"></div>
                <div class="modal-id-area">
                    <div class="id-row">
                        <input id="modalBgmId" type="number" placeholder="Bangumi ID">
                        <button id="modalIdBtn">ID 查询</button>
                        <button id="modalSearchBtn">搜索</button>
                    </div>
                    <div class="meta-row" id="modalMeta"></div>
                </div>
            </div>

            <div class="modal-field">
                <label>中文名</label>
                <input id="modalNameCn" placeholder="中文名">
            </div>
            <div class="modal-field">
                <label>原名</label>
                <input id="modalName" placeholder="原名">
            </div>
            <div class="modal-field">
                <label>简介</label>
                <textarea id="modalSummary" placeholder="简介"></textarea>
            </div>
            <div class="modal-field">
                <div class="inline-group">
                    <div style="flex:1">
                        <label>集数</label>
                        <input id="modalEps" type="number" placeholder="集数">
                    </div>
                    <div style="flex:1">
                        <label>评分</label>
                        <input id="modalRating" type="text" readonly style="background:#f5f5f5;color:#888">
                    </div>
                    <div style="flex:1">
                        <label>排名</label>
                        <input id="modalRank" type="text" readonly style="background:#f5f5f5;color:#888">
                    </div>
                </div>
            </div>
            <div class="modal-field">
                <div class="inline-group">
                    <div style="flex:2">
                        <label>播出日期</label>
                        <input id="modalAirDate" type="text" placeholder="2024-01">
                    </div>
                    <div style="flex:1">
                        <label>周几</label>
                        <select id="modalAirWeekday">
                            <option value="">未知</option>
                            <option value="1">周一</option>
                            <option value="2">周二</option>
                            <option value="3">周三</option>
                            <option value="4">周四</option>
                            <option value="5">周五</option>
                            <option value="6">周六</option>
                            <option value="7">周日</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- RSS 元数据（仅新订阅预览时显示） -->
            <div id="modalRssInfo" style="display:none;margin-top:8px;padding:8px;background:#f8f9fa;border-radius:4px;font-size:.78rem;color:#555">
                <div style="margin-bottom:4px"><span class="tag" id="modalRssGroup"></span> <span id="modalRssLatest"></span></div>
                <div id="modalRssSamples" style="margin-top:4px"></div>
                <div class="modal-field" style="margin:6px 0 0 0">
                    <label>季数</label>
                    <select id="modalSeason">
                        <option value="1">S1</option><option value="2">S2</option><option value="3">S3</option>
                        <option value="4">S4</option><option value="5">S5</option><option value="6">S6</option>
                        <option value="7">S7</option><option value="8">S8</option><option value="9">S9</option><option value="10">S10</option>
                    </select>
                </div>
            </div>

            <div class="modal-actions">
                <button onclick="closeBangumiModal()" style="background:#f0f0f0;color:#666;border:1px solid #ddd">取消</button>
                <button id="modalSaveBtn" onclick="saveBangumiModal()">✅ 保存</button>
            </div>
        </div>
    </div>
</body>

</html>
